<!DOCTYPE html>
<html class="staticrypt-html" lang="ro">
    <head>
        <meta charset="utf-8" />
        <title>Curs protejat cu parolă</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            /* Look of the title slide: _brand.yml + _assets/custom.scss */
            :root {
                --burgundy: #4a1628;
                --wine: #8b2635;
                --parchment: #f5e0c0;
                --sand: #d4b896;
                --linen: #e8d5b7;
                --serif: Charter, "Charter BT", Georgia, "Times New Roman", Times, serif;
            }
            html, body { margin: 0; height: 100%; }
            body.staticrypt-body {
                background: var(--burgundy);
                color: var(--linen);
                font-family: var(--serif);
                -webkit-font-smoothing: antialiased;
            }
            .staticrypt-content { min-height: 100%; display: flex; flex-direction: column; }
            .staticrypt-page {
                flex: 1;
                display: flex; flex-direction: column; justify-content: center;
                width: 100%; max-width: 34rem; margin: 0 auto;
                padding: 2.5rem 16px 4rem; box-sizing: border-box;
                text-align: center;
            }
            .titlu {
                color: #fff; font-weight: 700; text-transform: uppercase;
                font-size: clamp(2rem, 9vw, 3.6rem); line-height: 1.05;
                letter-spacing: -0.05em; margin: 0 0 0.35em;
            }
            .subtitlu { font-size: clamp(1.1rem, 4.5vw, 1.45rem); margin: 0 0 1.4em; }
            .autor { color: #fff; font-size: 1.1rem; margin: 0; }
            .afiliere { font-size: 0.9rem; margin: 0.2em 0 0; }
            .data { font-size: 1.1rem; margin: 0.8em 0 0; }
            .staticrypt-hr {
                border: 0; border-top: 1px solid var(--sand); opacity: 0.6;
                width: 6rem; margin: 1.8rem auto;
            }
            .staticrypt-instructions p { font-size: 0.95rem; line-height: 1.45; margin: 0 0 1.2em; }
            .staticrypt-password-container { position: relative; margin: 0 0 0.9em; }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%; box-sizing: border-box;
                padding: 0.75em 2.8em 0.75em 0.9em;
                font: 1.1rem var(--serif); color: var(--burgundy);
                background: var(--parchment); border: 2px solid var(--sand); border-radius: 4px;
                outline: 0;
            }
            .staticrypt-form input[type="password"]:focus,
            .staticrypt-form input[type="text"]:focus { border-color: #fff; }
            .staticrypt-toggle-password-visibility {
                position: absolute; top: 50%; right: 0.8em; transform: translateY(-50%);
                width: 1.3em; height: 1.3em; cursor: pointer; opacity: 0.55;
            }
            label.staticrypt-remember {
                display: flex; align-items: center; justify-content: center; gap: 0.6em;
                font-size: 0.95rem; margin: 0 0 1.1em; cursor: pointer;
            }
            .staticrypt-remember input[type="checkbox"] {
                width: 1.1em; height: 1.1em; accent-color: var(--wine); margin: 0;
            }
            .staticrypt-decrypt-button {
                width: 100%; padding: 0.7em; cursor: pointer;
                font: 700 1rem var(--serif); text-transform: uppercase; letter-spacing: 0.12em;
                color: var(--burgundy); background: var(--parchment);
                border: 0; border-radius: 4px;
            }
            .staticrypt-decrypt-button:hover { background: #fff; }
            .eroare {
                color: #fff; background: var(--wine); border-radius: 4px;
                padding: 0.5em 0.8em; margin: 0 0 0.9em; font-size: 0.95rem;
            }
            .logo { position: fixed; right: 16px; bottom: 16px; width: 44px; height: auto; opacity: 0.9; }
            .hidden { display: none !important; }
            .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; }
            .staticrypt-spinner {
                width: 2rem; height: 2rem; border: 0.25em solid var(--linen);
                border-right-color: transparent; border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
        </style>
    </head>
